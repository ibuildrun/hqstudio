name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Rebuild images and installer for an existing release version (e.g. 1.20.0); skips semantic-release'
        required: false
        default: ''

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  # ===========================================
  # Run Tests First
  # ===========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Test API
        run: dotnet test HQStudio.API.Tests/HQStudio.API.Tests.csproj --verbosity normal
      
      - name: Test Web
        working-directory: HQStudio.Web
        run: |
          npm ci --legacy-peer-deps
          npm test

  # ===========================================
  # Semantic Release
  # ===========================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: test
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published || steps.manual.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version || steps.manual.outputs.new_release_version }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Semantic Release
        id: semantic
        if: ${{ github.event.inputs.version == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release || echo "No release needed"

      - name: Use the given version
        id: manual
        if: ${{ github.event.inputs.version != '' }}
        run: |
          echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          echo "new_release_version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"

  # ===========================================
  # Build & Push Docker Images
  # ===========================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./HQStudio.API
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ needs.release.outputs.new_release_version }}
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
      
      - name: Build and push Web
        uses: docker/build-push-action@v7
        with:
          context: ./HQStudio.Web
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ needs.release.outputs.new_release_version }}
            ${{ env.REGISTRY }}/${{ github.repository }}/web:latest

  # ===========================================
  # Build Desktop Release
  # ===========================================
  desktop:
    name: Build Desktop
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Update version in csproj
        run: |
          $version = "${{ needs.release.outputs.new_release_version }}"
          $csproj = "HQStudio.Desktop/HQStudio.csproj"
          $content = Get-Content $csproj -Raw
          $content = $content -replace '<Version>.*</Version>', "<Version>$version</Version>"
          Set-Content $csproj $content
          Write-Host "Updated version to $version"
      
      - name: Build installer and server bundle
        run: ./installer/build.ps1 -Version "${{ needs.release.outputs.new_release_version }}"

      - name: Create Desktop ZIP
        run: Compress-Archive -Path dist/publish/HQStudio.exe -DestinationPath HQStudio-Desktop-v${{ needs.release.outputs.new_release_version }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            HQStudio-Desktop-v${{ needs.release.outputs.new_release_version }}.zip
            dist/HQStudio-Server-v${{ needs.release.outputs.new_release_version }}.zip
            dist/HQStudio-Setup-${{ needs.release.outputs.new_release_version }}.exe
